name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - '**.MD'
      - 'LICENSE'
      - '.gitignore'
      - 'assets/**'
      - 'profiles/**'
      - 'data/**'
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - '**.MD'
      - 'LICENSE'
      - '.gitignore'
      - 'assets/**'
      - 'profiles/**'
      - 'data/**'

jobs:
  teamserver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build and vet
        run: |
          cd teamserver
          go build ./...
          go vet ./...

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev libqt5websockets5-dev python3-dev cmake build-essential

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Build client
        run: |
          mkdir -p client/Build
          cd client/Build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j2
